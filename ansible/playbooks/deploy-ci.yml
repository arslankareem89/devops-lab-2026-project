---
- name: Deploy CI services (Jenkins + SonarQube + PostgreSQL) to CI EC2
  hosts: ci
  become: yes
  vars:
    ci_compose_file: "docker-compose.ci.yml"

  tasks:
    - name: Create project directory
      file:
        path: /home/ec2-user/devops-lab
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copy CI docker-compose file
      copy:
        src: "{{ playbook_dir }}/../../{{ ci_compose_file }}"
        dest: "/home/ec2-user/devops-lab/{{ ci_compose_file }}"
      become: yes

    - name: Copy cloudwatch config
      copy:
        src: "{{ playbook_dir }}/../../docker/cloudwatch/"
        dest: "/home/ec2-user/devops-lab/docker/cloudwatch/"
      become: yes

    - name: Remove existing CI containers
      command: docker-compose -f {{ ci_compose_file }} down -v
      args:
        chdir: /home/ec2-user/devops-lab
      ignore_errors: true
      changed_when: false

    - name: Start CI containers
      command: docker-compose -f {{ ci_compose_file }} up -d
      args:
        chdir: /home/ec2-user/devops-lab

    - name: Wait for PostgreSQL to be ready
      command: docker exec sonar-postgres pg_isready -U sonar
      register: pg_status
      retries: 10
      delay: 5
      until: pg_status is success
      ignore_errors: true

    - name: Wait for Jenkins to be ready
      uri:
        url: "http://localhost:8080/jenkins/login"
        status_code: 200
      register: jenkins_status
      retries: 15
      delay: 10
      until: jenkins_status.status == 200
      ignore_errors: true

    - name: Wait for SonarQube to be ready
      uri:
        url: "http://localhost:9000/sonar"
        status_code: 200
      register: sonar_status
      retries: 15
      delay: 10
      until: sonar_status.status == 200
      ignore_errors: true

    - name: Print CI deployment status
      debug:
        msg: |
          CI services deployed:
            - PostgreSQL:        localhost:5432
            - Jenkins:           http://localhost:8080/jenkins/
            - SonarQube:         http://localhost:9000/sonar/
            - CloudWatch Agent:  logs → devops-lab-ec2-logs
