global:
  scrape_interval: 15s

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: app
    static_configs:
      - targets: [app:5000]

  - job_name: jenkins
    static_configs:
      - targets: [CI_PRIVATE_IP:8080]

  - job_name: sonarqube
    static_configs:
      - targets: [CI_PRIVATE_IP:9000]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
